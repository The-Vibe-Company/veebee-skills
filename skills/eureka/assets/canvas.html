<title>Eureka</title>
<style>
  :root {
    --bg: #efece5; --paper: #fffdf9; --ink: #1c1a16; --muted: #8a8479;
    --line: #e8e3d9; --accent: #f27313; --accent-soft: #fff1e6;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121110; --paper: #1c1a17; --ink: #f1ede4; --muted: #8f887b;
      --line: #2b2823; --accent: #f27313; --accent-soft: #2e1d10;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121110; --paper: #1c1a17; --ink: #f1ede4; --muted: #8f887b;
    --line: #2b2823; --accent: #f27313; --accent-soft: #2e1d10;
  }
  body { background: var(--bg); color: var(--ink); font-family: var(--serif); }
  .sheet { max-width: 640px; min-height: 80vh; margin: 40px auto; padding: 72px 64px 64px; background: var(--paper);
           box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 40px rgba(0,0,0,.08); }
  h1 { font-weight: 500; font-size: 40px; line-height: 1.1; margin: 0 0 40px; letter-spacing: -.01em; }
  h1.untitled { color: var(--muted); font-style: italic; font-weight: 400; }
  .idea p { font-size: 19px; line-height: 1.6; margin: 0 0 18px; }
  .section { margin: 0 0 26px; }
  .section h2 { font-family: var(--sans); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  .section p { font-size: 18px; line-height: 1.55; margin: 0; }
  .idea p.pending { color: var(--muted); }
  .done { margin-top: 48px; font-family: var(--sans); font-size: 14px; color: var(--muted); }
  .done code { font-family: ui-monospace, Menlo, monospace; color: var(--ink); }
  @media (max-width: 640px) { .sheet { margin: 0; padding: 48px 24px; min-height: 100vh; } h1 { font-size: 32px; } }
</style>

<div class="sheet">
  <h1 id="title"></h1>
  <div class="idea" id="idea"></div>
  <div class="done" id="done" hidden></div>
</div>

<script>
// Edit only this object.
// - title: "" until the idea has a name; the page shows "Sans titre" / "Untitled" meanwhile.
// - lines: the idea so far, as short sentences in the user's words, one string per paragraph. Empty at the start.
// - sections: the complete idea, once there is nothing left to ask: { heading, text } each, one or two sentences per text.
//   When sections is non-empty it replaces lines on the page.
// - done: true on the last turn only.
const IDEA = {
  lang: "fr",
  title: "",
  lines: [],
  sections: [],
  done: false,
};

const T = {
  fr: { untitled: "Sans titre", done: "Prochaine étape : <code>/challenge</code>." },
  en: { untitled: "Untitled", done: "Next step: <code>/challenge</code>." },
};

(function render() {
  const t = T[IDEA.lang] || T.en;
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const title = document.getElementById("title");
  title.textContent = IDEA.title || t.untitled;
  title.classList.toggle("untitled", !IDEA.title);
  const sections = (IDEA.sections || []).filter((x) => x && x.text);
  document.getElementById("idea").innerHTML = sections.length
    ? sections.map((x) => `<div class="section"><h2>${esc(x.heading)}</h2><p>${esc(x.text)}</p></div>`).join("")
    : IDEA.lines.filter(Boolean).map((l) => `<p>${esc(l)}</p>`).join("");
  const done = document.getElementById("done");
  done.hidden = !IDEA.done;
  done.innerHTML = t.done;
})();
</script>
